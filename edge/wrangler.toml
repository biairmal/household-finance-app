name = "household-money-edge"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Pinned Gemini Flash version. Check https://ai.google.dev/gemini-api/docs/models before changing.
GEMINI_MODEL = "gemini-2.5-flash"
# The Cloudflare Pages URL of the web build, plus local dev.
ALLOWED_ORIGINS = "https://household-money.pages.dev,http://localhost:8081,http://localhost:8788"

# Secrets (set with `npx wrangler secret put <NAME>`; for local dev put them in edge/.dev.vars):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GEMINI_API_KEY
